[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-water-isotope-model"
version = "0.1.0"
description = "Python implementation of the Simple Water Isotope Model (SWIM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [
    { name = "TBD" }
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Analysis-only dependencies are kept separate so the reusable model does not
# depend on plotting, notebooks, or project-specific analysis tools.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "parity: compares Python behavior against frozen MATLAB reference output",
    "integration: exercises multiple model components together",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Do not require strict typing everywhere during the initial scientific port.
# Tighten this incrementally once parity is established.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
